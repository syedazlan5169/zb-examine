name: zb-examine-prod

x-laravel-environment: &laravel-environment
  DB_CONNECTION: mysql
  DB_HOST: probono-mysql
  DB_PORT: 3306
  DB_DATABASE: zb_examine
  DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
      target: runtime
      args:
        RELEASE_ID: ${RELEASE_ID:?Set RELEASE_ID to the full Git SHA}
    image: zb-examine-app:${RELEASE_ID:?Set RELEASE_ID to the full Git SHA}
    restart: unless-stopped
    env_file:
      - ${LARAVEL_ENV_FILE:?Set LARAVEL_ENV_FILE}
    environment: *laravel-environment
    expose:
      - "9000"
    networks:
      - default
      - probono-db
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$socket = @fsockopen('127.0.0.1', 9000); exit($$socket === false ? 1 : 0);"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.production
      target: nginx-runtime
      args:
        RELEASE_ID: ${RELEASE_ID:?Set RELEASE_ID to the full Git SHA}
    image: zb-examine-nginx:${RELEASE_ID:?Set RELEASE_ID to the full Git SHA}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  scheduler:
    image: zb-examine-app:${RELEASE_ID:?Set RELEASE_ID to the full Git SHA}
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - ${LARAVEL_ENV_FILE:?Set LARAVEL_ENV_FILE}
    environment: *laravel-environment
    networks:
      - default
      - probono-db

networks:
  probono-db:
    external: true